name: Ruff

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  ruff:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
