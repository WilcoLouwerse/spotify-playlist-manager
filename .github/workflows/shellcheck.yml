name: ShellCheck

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091
        with:
          severity: warning
          ignore_paths: .venv __pycache__ .claude/skills/skill-creator
